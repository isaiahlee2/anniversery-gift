<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2e3c0" />
  <meta name="color-scheme" content="light" />
  <title>A Map of Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Kalam:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Hand-drawn doodles used around the map -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="d-ship" viewBox="0 0 64 64">
        <path d="M10 42 L54 42 L48 52 L16 52 Z" />
        <path d="M32 42 V8" />
        <path d="M32 10 L50 34 L32 34" />
        <path d="M30 14 L16 36 L30 36" />
        <path d="M32 8 L40 11 L32 14" />
        <path d="M4 57 q5 -3 10 0 t10 0 t10 0 t10 0 t10 0 t10 0" />
      </symbol>
      <symbol id="d-island" viewBox="0 0 64 64">
        <path d="M8 50 q24 -14 48 0" />
        <path d="M30 46 q-2 -16 4 -30" />
        <path d="M34 16 q-10 -6 -20 2 M34 16 q-4 -10 -14 -10 M34 16 q8 -8 18 -4 M34 16 q12 0 16 10" />
        <circle cx="31" cy="20" r="1.6" /><circle cx="35" cy="21" r="1.6" />
        <path d="M2 57 q5 -3 10 0 t10 0 t10 0 t10 0 t10 0 t10 0" />
      </symbol>
      <symbol id="d-serpent" viewBox="0 0 64 64">
        <path d="M4 44 q6 -16 12 0" /><path d="M20 44 q6 -16 12 0" /><path d="M36 44 q6 -16 12 0" />
        <path d="M50 44 q2 -18 8 -20 q4 -1 4 3 q-2 2 -5 1" />
        <circle cx="58" cy="25" r="0.9" />
        <path d="M2 48 q5 -3 10 0 t10 0 t10 0 t10 0 t10 0 t10 0" />
      </symbol>
      <symbol id="d-mountains" viewBox="0 0 64 64">
        <path d="M2 52 L20 22 L30 38 L40 18 L62 52 Z" />
        <path d="M15 30 L20 22 L25 30 M36 25 L40 18 L45 26" />
        <path d="M44 34 l3 5 M50 38 l3 5 M12 40 l3 5" />
      </symbol>
      <symbol id="d-balloon" viewBox="0 0 64 64">
        <path d="M32 6 C14 6 12 28 26 40 L38 40 C52 28 50 6 32 6 Z" />
        <path d="M32 6 C26 14 26 30 29 40 M32 6 C38 14 38 30 35 40" />
        <path d="M27 40 L28 48 M37 40 L36 48" />
        <rect x="27" y="48" width="10" height="8" rx="1" />
      </symbol>
      <symbol id="d-whale" viewBox="0 0 64 64">
        <path d="M6 38 C10 24 34 22 46 32 L56 24 L54 34 L60 40 L48 38 C40 46 14 48 6 38 Z" />
        <circle cx="16" cy="33" r="1.2" />
        <path d="M14 22 q-2 -6 2 -8 M14 22 q2 -6 6 -6" />
        <path d="M2 52 q5 -3 10 0 t10 0 t10 0 t10 0 t10 0 t10 0" />
      </symbol>
      <symbol id="d-lighthouse" viewBox="0 0 64 64">
        <path d="M24 56 L27 20 L37 20 L40 56 Z" />
        <path d="M25 32 L39 32 M26 44 L38 44" />
        <rect x="26" y="12" width="12" height="8" />
        <path d="M24 12 L32 6 L40 12" />
        <path d="M40 15 L56 10 M40 17 L56 22" />
        <path d="M10 58 L54 58" />
      </symbol>
      <symbol id="d-chest" viewBox="0 0 64 64">
        <path class="chest-lid" d="M8 30 C8 16 56 16 56 30 Z" />
        <rect x="8" y="30" width="48" height="24" rx="2" />
        <path d="M8 38 H56 M18 30 V54 M46 30 V54" />
        <rect class="chest-lock" x="28" y="32" width="8" height="10" rx="1.5" />
      </symbol>
      <symbol id="d-bottle" viewBox="0 0 64 64">
        <path d="M14 40 C10 34 16 28 22 30 L44 22 L46 18 L52 16 L54 22 L50 26 L48 30 L26 40 C24 46 16 46 14 40 Z" />
        <path d="M22 34 q6 -2 10 -6" />
        <path d="M2 50 q5 -3 10 0 t10 0 t10 0 t10 0 t10 0 t10 0" />
      </symbol>
      <symbol id="d-pouch" viewBox="0 0 64 64">
        <path d="M18 22 C8 30 8 56 32 56 C56 56 56 30 46 22 Z" />
        <path d="M18 22 C24 18 40 18 46 22" />
        <path d="M22 18 q10 -10 20 0" />
      </symbol>
    </defs>
  </svg>

  <!-- ============ INTRO ============ -->
  <section id="intro" class="screen intro">
    <div class="scroll" id="scroll">
      <div class="rod rod-top"></div>
      <div class="scroll-body">
        <div class="scroll-inner">
          <p class="scroll-kicker" id="intro-kicker"></p>
          <h1 id="intro-title"></h1>
          <p class="scroll-sub" id="intro-sub"></p>
          <div class="divider">✦ ✦ ✦</div>
          <div id="intro-note" class="scroll-note"></div>
          <button class="btn" id="begin-btn"></button>
        </div>
      </div>
      <div class="rod rod-bottom"></div>
    </div>
    <button class="seal" id="seal" aria-label="Break the seal">
      <span id="seal-text"></span>
    </button>
    <p class="tap-hint" id="tap-hint">tap the seal</p>
  </section>

  <!-- ============ MAP ============ -->
  <section id="map" class="screen map" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <span id="bar-title"></span>
        <small id="days-counter"></small>
      </div>
      <button class="pouch-btn" id="pouch-btn" aria-label="Your golden letters">
        <svg class="ink-icon"><use href="#d-pouch" /></svg>
        <span id="pouch-count">0/0</span>
      </button>
    </header>
    <div class="map-canvas parchment" id="map-canvas"></div>
  </section>

  <!-- ============ MEMORY SHEET ============ -->
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <article class="sheet-panel parchment" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" data-close></div>
      <button class="icon-btn sheet-close" data-close aria-label="Close">✕</button>
      <div class="sheet-scroll" id="sheet-scroll"></div>
      <nav class="sheet-nav">
        <button class="nav-btn" id="prev-btn" aria-label="Previous memory">← back</button>
        <span id="sheet-count"></span>
        <button class="nav-btn" id="next-btn" aria-label="Next memory">next →</button>
      </nav>
    </article>
  </div>

  <!-- ============ GENERIC MODAL ============ -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-mclose></div>
    <div class="modal-card parchment" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close" data-mclose aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ============ FINALE ============ -->
  <section class="finale parchment" id="finale" hidden>
    <div class="finale-inner" id="finale-inner"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
